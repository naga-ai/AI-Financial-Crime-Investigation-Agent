name: Deploy to EC2
on:
  push:
    branches: [main]

# Necessary for pushing to GitHub Container Registry
permissions:
  contents: write
  packages: write 

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Bump version
        id: bump
        run: |
          OLD=$(cat app/VERSION | tr -d '[:space:]')
          MAJOR=$(echo $OLD | cut -d. -f1)
          MINOR=$(echo $OLD | cut -d. -f2)
          NEW_MINOR=$((MINOR + 1))
          NEW="${MAJOR}.${NEW_MINOR}"
          echo "$NEW" > app/VERSION
          echo "new_version=$NEW" >> $GITHUB_OUTPUT
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/VERSION
          git commit -m "chore: bump version to $(cat app/VERSION)" || echo "Nothing to commit"
          git push

  build-and-deploy:
    needs: bump-version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log into GitHub's Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and Push — registry cache avoids GHA 10 GB cache limit
      - name: Build and push API image
        uses: docker/build-push-action@v5
        timeout-minutes: 30
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ai-financial-crime-api:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ai-financial-crime-api:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ai-financial-crime-api:cache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        timeout-minutes: 15
        with:
          context: ./app/frontend
          file: ./app/frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ai-financial-crime-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=http://${{ secrets.EC2_HOST }}:8000
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ai-financial-crime-frontend:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ai-financial-crime-frontend:cache,mode=max

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m # <--- FIX 1: SSH specific timeout fix
          script: |
            cd /opt/aml-dashboard
            git pull
            # Login to GHCR on the EC2 so it can pull the image
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # Free up disk space before pulling new images
            sudo docker system prune -af --volumes
            export GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}
            sudo --preserve-env=GITHUB_REPOSITORY_OWNER docker compose -f app/docker-compose.yml pull
            sudo --preserve-env=GITHUB_REPOSITORY_OWNER docker compose -f app/docker-compose.yml up -d
