version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Python FastAPI backend ──────────────────────────────────────────
  api:
    # We now pull the pre-built image from GitHub
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/ai-financial-crime-api:latest
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LLM_MODEL=gpt-4o-mini
      - LLM_TEMPERATURE=0.1
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./models:/app/models
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Next.js frontend ─────────────────────────────────────────────────
  frontend:
    # We now pull the pre-built image from GitHub
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/ai-financial-crime-frontend:latest
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  redis_data:
